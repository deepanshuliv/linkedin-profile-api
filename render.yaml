services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LINKEDIN_BROWSER_HEADLESS
        value: "true"
      - key: LINKEDIN_BROWSER_PROFILE
        value: /app/data/chrome-profile
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
